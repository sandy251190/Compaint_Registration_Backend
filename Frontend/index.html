<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComplainHub | Premium Grievance Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Stylish Background -->
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-circle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <div class="logo-text">
                    <h2>ComplainHub</h2>
                </div>
            </div>
            <nav class="nav-tabs">
                <button class="nav-tab active" id="tab-btn-form" onclick="switchTab('form')">Register</button>
                <button class="nav-tab" id="tab-btn-list" onclick="switchTab('list')">Dashboard</button>
            </nav>
        </header>

        <!-- Main Content: Registration Form -->
        <main id="section-form" class="tab-content">
            <div class="card">
                <h1 class="card-title">File a Complaint</h1>
                <p class="card-subtitle">Complete the form below to register your grievance. Our team will review it within 24 hours.</p>
                
                <form id="complaintForm">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-input" placeholder="Enter your name" required>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">City</label>
                            <input type="text" id="city" class="form-input" placeholder="Your city" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Mobile Number</label>
                            <input type="tel" id="mobile" class="form-input" placeholder="10-digit number" pattern="[0-9]{10}" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Complaint Details</label>
                        <textarea id="complaint" class="form-input" style="height: 150px; resize: none;" placeholder="Describe your issue in detail..." required></textarea>
                    </div>

                    <div id="successMessage" class="hidden" style="background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: center; font-weight: 600;">
                        🎉 Complaint registered successfully! Your data has been saved.
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Submit Registration</button>
                </form>
            </div>
        </main>

        <!-- Main Content: Complaint List -->
        <main id="section-list" class="tab-content hidden">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <div>
                        <h1 class="card-title">Recent Submissions</h1>
                        <p class="card-subtitle">Track the status of your reported issues.</p>
                    </div>
                    <button onclick="loadComplaints()" class="nav-tab" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);">Refresh</button>
                </div>
                
                <div id="complaintsContainer">
                    <!-- Complaints will be injected here -->
                    <p style="text-align: center; color: var(--text-muted); padding: 3rem;">Loading data...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
